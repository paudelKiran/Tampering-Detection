<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRNet-W18 Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --stem: #4ade80;
    --branch1: #60a5fa;
    --branch2: #f472b6;
    --branch3: #fb923c;
    --branch4: #a78bfa;
    --fuse: #facc15;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: auto;
  }

  header {
    padding: 2rem 3rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: -1px;
    color: #fff;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .legend {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    font-size: 0.65rem;
    color: var(--muted);
    padding: 1rem 3rem;
    border-bottom: 1px solid var(--border);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  .canvas-wrap {
    padding: 2rem 3rem 3rem;
    overflow-x: auto;
  }

  svg {
    display: block;
    min-width: 1100px;
  }

  /* Node styles */
  .node rect {
    rx: 6;
    ry: 6;
  }

  .node text {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    fill: #fff;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  .node text.small {
    font-size: 8px;
    fill: rgba(255,255,255,0.6);
  }

  .arrow {
    fill: none;
    stroke-width: 1.5;
    marker-end: url(#arrow);
  }

  .connector {
    fill: none;
    stroke-width: 1;
    stroke-dasharray: 4,3;
    opacity: 0.5;
  }

  .stage-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    fill: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .branch-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    fill: rgba(255,255,255,0.25);
  }

  .glow {
    filter: url(#glow);
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>HRNet<span>-W18</span> Backbone</h1>
    <div class="subtitle">High-Resolution Network · Multi-Scale Feature Fusion</div>
  </div>
  <div style="text-align:right; font-size:0.65rem; color:var(--muted); line-height:1.8">
    <div>filters: 18 / 36 / 72 / 144</div>
    <div>outputs: 4 multi-scale feature maps</div>
    <div>blocks per stage: 2 residual blocks</div>
  </div>
</header>

<div class="legend">

  <div class="legend-item"><div class="dot" style="background:#f472b6"></div> Branch 2 (W=36)</div>

  <div class="legend-item"><div class="dot" style="background:#facc15"></div> Fusion (Add + ReLU)</div>
  <div class="legend-item"><div class="dot" style="background:#94a3b8"></div> Residual Block</div>
